<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1, user-scalable=no">
		<title>纯记账下载</title>
		<style>
			html,body{
				width: 100%;
				height: 100%;
				position: absolute;
				overflow-x: hidden;
				background: url(shareBg.png) no-repeat;
				background-size: 100% 100%;
			}
		</style>
	</head>
	<body>
	   <p id="download-status" role="status">正在获取最新版本…</p>
	   <a id="download-link" hidden>下载纯记账</a>
	</body>
	<script>
		(function () {
			var status = document.getElementById('download-status');
			var link = document.getElementById('download-link');
			function isDownloadable(release) {
				return release && typeof release.versionName === 'string' && release.versionName.trim() &&
					typeof release.apkUrl === 'string' && /^https?:\/\//i.test(release.apkUrl);
			}
			fetch('../update/app_version.json', { cache: 'no-cache' })
				.then(function (response) {
					if (!response.ok) throw new Error('Failed to load app version');
					return response.json();
				})
				.then(function (versions) {
					var official = isDownloadable(versions.Official) ? versions.Official : null;
					var beta = isDownloadable(versions.beta) ? versions.beta : null;
					var sameRelease = official && beta && (
						beta.apkUrl === official.apkUrl ||
						(beta.versionCode === official.versionCode && beta.versionName === official.versionName)
					);
					var release = beta && !sameRelease ? beta : official;
					if (!release) throw new Error('No downloadable app version');
					link.href = release.apkUrl;
					link.textContent = '下载纯记账 ' + release.versionName;
					link.hidden = false;
					status.textContent = '即将开始下载，如未开始，请点击下载链接。微信内请通过右上角菜单在浏览器中打开。';
					location.href = release.apkUrl;
				})
				.catch(function () {
					status.textContent = '版本信息暂时不可用，请刷新重试。';
				});
		})();
	</script>
</html>
